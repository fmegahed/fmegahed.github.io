<script>
// In-class editable notes persisted to localStorage (xaringanExtra .can-edit style)
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".can-edit, .edit-text").forEach(function (el) {
    var key = "sight-m27-" + el.dataset.key;
    try {
      var saved = localStorage.getItem(key);
      if (saved) el.innerHTML = saved;
    } catch (e) {}
    el.addEventListener("input", function () {
      try { localStorage.setItem(key, el.innerHTML); } catch (e) {}
      updateCounts();
    });
  });
  document.querySelectorAll("input[type=checkbox][data-key]").forEach(function (cb) {
    var key = "sight-m27-cb-" + cb.dataset.key;
    try { cb.checked = localStorage.getItem(key) === "1"; } catch (e) {}
    cb.addEventListener("change", function () {
      try { localStorage.setItem(key, cb.checked ? "1" : "0"); } catch (e) {}
    });
  });
  function wordCount(el) {
    var txt = el.innerText || "";
    var w = txt.trim().split(/\s+/).filter(function (x) { return x.length; });
    return w.length;
  }
  function updateCounts() {
    document.querySelectorAll(".wc").forEach(function (c) {
      var keys = c.dataset.for.split(" ");
      var total = 0, limit = 0;
      keys.forEach(function (k) {
        var el = document.querySelector('[data-key="' + k + '"]');
        if (el) { total += wordCount(el); limit += parseInt(el.dataset.limit || "0", 10); }
      });
      if (!limit && keys.length > 1) limit = 600;
      c.textContent = "(" + total + " of " + limit + " words)";
      c.classList.toggle("over", total > limit);
    });
  }
  updateCounts();
});
</script>
