<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Kalam:wght@400&display=swap">
<style>
/* ================= Meeting 29 components ================= */
:root { --red:#c3142d; --navy:#3E5468; --blue:#3E5468; --gray:#585E60; --green:#2e7d32; --gold:#8a6d00; --ink:#1f2326; --wash:#fdf1f3; --mill:#c3142d; --lathe:#3E5468; --cobot:#FDE778; --corn:#FDE778; --tanL:#EDECE2; --tanM:#CCC9B8; --tanD:#70685C; --accent:#AD102A; }

/* Entrance animation: plays every time the slide becomes current. */
.reveal .slides section .pop { opacity:0; }
.reveal .slides section.present .pop { animation: m29pop .6s cubic-bezier(.2,.8,.3,1.15) forwards; animation-delay: calc(var(--d, 0) * 0.13s + 0.1s); }
@keyframes m29pop { from { opacity:0; transform: translateY(22px) scale(.97); } to { opacity:1; transform:none; } }
html.print-pdf .pop, .print-pdf .pop { opacity:1 !important; animation:none !important; }
.stepper { display:none !important; }

.kicker { font-size:0.62em; color:var(--gray); margin:-0.2em 0 0.45em 0; line-height:1.3; }
.kicker b { color:var(--red); }
.note { font-size:0.5em; color:var(--gray); line-height:1.35; }
.src { font-size:0.42em; color:var(--gray); text-align:right; margin-top:0.35em; }
.bigline { font-size:0.84em; font-weight:bold; line-height:1.25; color:var(--ink); }
.bigline em { font-style:normal; color:var(--red); }

/* machine chips */
.mchip { display:inline-block; border-radius:14px; padding:2px 12px; color:#fff; font-weight:bold; white-space:nowrap; }
.m-mill { background:var(--mill); } .m-lathe { background:var(--lathe); } .m-cobot { background:var(--cobot); color:#1f2326 !important; }

/* ---------- What we are testing ---------- */
.what-q { font-size:0.86em; font-weight:bold; line-height:1.25; color:var(--ink); margin:0.1em 0 0.5em 0; }
.what-q em { font-style:normal; color:var(--red); }
.what-grid { display:grid; grid-template-columns:1.25fr 1fr; gap:26px; }
.what-h { font-size:0.58em; font-weight:bold; text-transform:uppercase; letter-spacing:1.5px; color:var(--gray); margin-bottom:8px; }
.mach3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.mach3 figure, .ways figure { margin:0; }
.mach3 img { width:100%; height:150px; object-fit:cover; border-radius:10px; display:block; margin:0 !important; box-shadow:0 2px 8px rgba(0,0,0,.18); }
.mach3 figcaption { font-size:0.56em; font-weight:bold; margin-top:6px; line-height:1.2; }
.mach3 figcaption span { display:block; font-weight:normal; color:var(--gray); font-size:0.88em; }
.ways { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.ways img { width:100%; height:150px; object-fit:cover; border-radius:10px; display:block; margin:0 !important; box-shadow:0 2px 8px rgba(0,0,0,.18); }
.ways figcaption { font-size:0.56em; font-weight:bold; margin-top:6px; line-height:1.2; }
.ways figcaption span { display:block; font-weight:normal; color:var(--gray); font-size:0.88em; }
.measure { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:22px; }
.measure div { border-top:5px solid var(--red); padding-top:8px; font-size:0.56em; line-height:1.3; }
.measure b { display:block; font-size:1.15em; margin-bottom:2px; }

/* ---------- Cohort ---------- */
.cohort-wrap { display:grid; grid-template-columns:1.25fr 1fr; gap:30px; align-items:center; margin-top:0.1em; }
.cohort { display:grid; grid-template-columns:repeat(10, 1fr); gap:8px 6px; }
.cohort svg { width:100%; height:auto; color:var(--navy); transition: color .5s, opacity .5s, transform .5s; }
.reveal .slides section .cohort svg { opacity:0; }
.reveal .slides section.present .cohort svg { animation: m29pop .45s ease-out forwards; animation-delay: calc(var(--i) * 22ms + 0.15s); }
[data-step="1"] .cohort svg.drop, [data-step="2"] .cohort svg.drop, [data-step="3"] .cohort svg.drop { color:#cfcfcf; transform: scale(.82); }
[data-step="2"] .cohort svg:not(.drop), [data-step="3"] .cohort svg:not(.drop) { color:var(--red); }
.c-side .c-row { display:flex; align-items:baseline; gap:14px; margin-bottom:14px; }
.c-n { font-size:2.1em; font-weight:bold; line-height:1; min-width:96px; text-align:right; color:var(--navy); }
.c-row.drop .c-n { color:#9a9a9a; } .c-row.done .c-n { color:var(--red); }
.c-t { font-size:0.62em; line-height:1.3; }
.c-t b { display:block; font-size:1.1em; }
.two-sess { display:grid; grid-template-columns:1fr 150px 1fr; align-items:center; margin-top:22px; }
.ts { border-radius:12px; padding:12px 16px; color:#fff; font-size:0.6em; line-height:1.3; position:relative; }
.ts b { display:block; font-size:1.2em; }
.ts-vr { background:var(--navy); } .ts-ar { background:var(--red); }
.ts .usd { position:absolute; right:10px; top:-14px; width:56px; height:56px; border-radius:50%; background:#EFDB72; color:#222; font-weight:bold; display:flex; align-items:center; justify-content:center; font-size:0.95em; box-shadow:0 2px 6px rgba(0,0,0,.25); }
.ts-gap { text-align:center; font-size:0.56em; color:var(--gray); position:relative; }
.ts-gap:before { content:""; position:absolute; left:8px; right:8px; top:-10px; border-top:3px dashed #b9b9b9; }

/* ---------- Machine orders ---------- */
.orders { width:100%; border-collapse:separate; border-spacing:0 7px; font-size:0.6em; }
.orders th { text-align:left; color:#fff; background:var(--red); font-size:0.86em; padding:6px 8px; } .orders th:first-child { border-radius:8px 0 0 8px; } .orders th:last-child { border-radius:0 8px 8px 0; }
.orders td { padding:6px 8px; background:var(--tanL); }
.orders td:first-child { border-radius:8px 0 0 8px; font-weight:bold; color:var(--red); width:9%; text-align:center; }
.orders td:last-child { border-radius:0 8px 8px 0; color:#333; font-variant-numeric:tabular-nums; }
.orders .arrow { color:#999; padding:0 4px; }
.orders tr.hi td { background:var(--corn); }

/* ---------- VR session stepper ---------- */
.vs-phases { position:relative; z-index:1; display:flex; font-size:0.46em; font-weight:bold; color:var(--gray); text-transform:uppercase; letter-spacing:1px; margin-top:0.1em; }
.vs-phases div { border-bottom:3px solid #d8d8d8; padding-bottom:3px; margin-right:3px; }
.vs-track { position:relative; display:flex; gap:3px; height:48px; margin-top:46px; }
.vs-seg { border-radius:6px; position:relative; display:flex; align-items:center; justify-content:center; color:#fff; font-size:0.42em; font-weight:bold; overflow:hidden; opacity:.38; transition: opacity .4s, transform .4s, box-shadow .4s; white-space:nowrap; }
.vs-seg.p { background:var(--red); } .vs-seg.b { background:var(--tanM); } .vs-seg.v { background:var(--navy); } .vs-seg.e { background:var(--tanD); }
.vs-seg.done { opacity:.75; }
.vs-seg.on { opacity:1; transform: translateY(-4px); box-shadow:0 6px 14px rgba(0,0,0,.25); }
[data-step="0"] .vs-seg { opacity:1; }
.vs-marker { position:absolute; top:-40px; left:0; transform:translateX(-50%); transition:left .7s cubic-bezier(.4,.1,.2,1); z-index:3; }
.vs-marker span { display:flex; align-items:center; justify-content:center; width:46px; height:30px; border-radius:15px; background:var(--ink); color:#fff; font-size:0.46em; font-weight:bold; }
.vs-marker:after { content:""; position:absolute; left:50%; bottom:-7px; margin-left:-7px; border:7px solid transparent; border-bottom:none; border-top-color:var(--ink); }
.vs-ticks { position:relative; height:22px; font-size:0.42em; color:var(--gray); margin-top:4px; }
.vs-ticks span { position:absolute; transform:translateX(-50%); }
.vs-body { position:relative; height:330px; margin-top:8px; }
.vs-card { position:absolute; inset:0; display:grid; grid-template-columns:1.35fr 1fr; gap:24px; opacity:0; transform: translateX(30px); transition: opacity .45s, transform .45s; pointer-events:none; }
.vs-card.on { opacity:1; transform:none; pointer-events:auto; }
.vs-time { display:inline-block; background:var(--ink); color:#fff; border-radius:8px; padding:3px 12px; font-size:0.56em; font-weight:bold; font-variant-numeric:tabular-nums; }
.vs-title { font-size:0.95em; font-weight:bold; line-height:1.15; margin:8px 0 10px 0; color:var(--ink); }
.vs-who { display:grid; grid-template-columns:44px 1fr; gap:4px 12px; align-items:start; font-size:0.6em; line-height:1.32; margin-bottom:10px; }
.vs-who i { font-style:normal; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1em; color:#fff; }
.vs-who i.pt { background:var(--red); } .vs-who i.ra { background:var(--navy); }
.vs-who b { display:block; font-size:0.85em; text-transform:uppercase; letter-spacing:1px; color:var(--gray); }
.vs-img { display:flex; align-items:flex-start; justify-content:center; height:100%; }
.vs-img img { max-height:322px !important; max-width:100% !important; width:auto; border:1px solid #d8d8d8; box-shadow:0 4px 14px rgba(0,0,0,.18); border-radius:4px; margin:0 !important; background:#fff; }
.vs-img.wide img { max-height:240px !important; border-radius:10px; }
.vs-intro { font-size:0.7em; line-height:1.4; }
.vs-intro .mchip { font-size:0.85em; }

/* ---------- Clip pages ---------- */
.vr-stage { display:grid; grid-template-columns:2.15fr 1fr; gap:22px; align-items:start; }
.vr-stage video { width:100%; border-radius:10px; background:#000; display:block; box-shadow:0 3px 12px rgba(0,0,0,.25); }
.chap { display:block; width:100%; text-align:left; font:inherit; font-size:0.54em; line-height:1.25; background:none; border:none; border-left:5px solid #e3e3e3; padding:6px 0 6px 12px; margin:0 0 6px 0; cursor:pointer; color:inherit; }
.chap b { color:var(--red); font-variant-numeric:tabular-nums; margin-right:6px; }
.chap:hover { border-left-color:var(--gray); }
.chap.on { border-left-color:var(--red); background:#fff5f6; }
.ar3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.ar3 figure { margin:0; }
.ar3 video { width:100%; height:300px; object-fit:cover; border-radius:10px; background:#000; display:block; box-shadow:0 3px 12px rgba(0,0,0,.25); }
.ar3 figcaption { font-size:0.54em; line-height:1.28; margin-top:7px; }
.ar3 figcaption b { display:block; font-size:1.08em; }

/* ---------- Change cards (consent) ---------- */
.chg-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:0.15em; }
.cc { border:2px solid #e3e3e3; border-radius:12px; padding:12px 14px 14px 14px; min-height:200px; box-sizing:border-box; background:#fff; position:relative; }
.cc .ic { width:46px; height:46px; border-radius:50%; background:var(--wash); display:flex; align-items:center; justify-content:center; font-size:0.85em; margin-bottom:6px; }
.cc h5 { margin:0 0 4px 0; font-size:0.66em; text-transform:none; letter-spacing:0; color:var(--ink); font-weight:bold; font-family:inherit; }
.cc .was { font-size:0.52em; color:#8c8c8c; text-decoration:line-through; line-height:1.25; }
.cc .now { font-size:0.58em; line-height:1.3; margin-top:4px; color:var(--ink); }
.cc .now b { color:var(--red); }
.cc.new { border-color:var(--green); }
.cc.new:after { content:"NEW"; position:absolute; top:10px; right:10px; background:var(--green); color:#fff; font-size:0.4em; font-weight:bold; border-radius:8px; padding:1px 8px; }
.keep { margin-top:14px; font-size:0.56em; background:#fffaf0; border-left:6px solid #EFDB72; padding:8px 14px; line-height:1.35; }

/* ---------- Protocol: folder tree ---------- */
.proto { display:grid; grid-template-columns:1fr 1.05fr; gap:28px; }
.tree { white-space:pre; font-family:'Inconsolata', monospace; font-size:0.58em; line-height:1.5; background:#1f2326; color:#e8e8e8; border-radius:12px; padding:14px 18px; }
.tree .d { color:#EFDB72; font-weight:bold; }
.tree .f { color:#9fd3ff; }
.tree .x { color:#ff9aa6; }
.tree .c { color:#9a9a9a; font-family:'Lato', sans-serif; font-size:0.86em; }
.plist div { display:grid; grid-template-columns:40px 1fr; gap:10px; align-items:start; padding:7px 0; border-bottom:1px solid #eee; font-size:0.56em; line-height:1.3; }
.plist i { font-style:normal; font-size:1.25em; text-align:center; }
.plist b { color:var(--ink); }
.plist .badge { display:inline-block; background:var(--green); color:#fff; font-size:0.72em; border-radius:8px; padding:0 7px; margin-left:6px; vertical-align:2px; }

/* ---------- Data path ---------- */
.dp { position:relative; width:100%; }
.dp svg { width:100%; height:auto; display:block; }
.dp .st circle { fill:#fff; stroke:#c9c9c9; stroke-width:4; transition: stroke .4s, fill .4s; }
.dp .st text.em { font-size:34px; }
.dp .st text.lb { font-size:17px; font-weight:bold; fill:#1f2326; font-family:'Lato', sans-serif; }
.dp .st text.sb { font-size:13px; fill:#585E60; font-family:'Lato', sans-serif; }
.dp .st.on circle { stroke:var(--red); fill:#fff5f6; stroke-width:8; }
.dp .st.ok.on circle { stroke:var(--green); fill:#f1f8f1; stroke-width:8; }
.dp .st.lock.on circle { stroke:var(--navy); fill:#eef1f4; stroke-width:8; }
.dp-cap { min-height:2.9em; margin-top:6px; font-size:0.66em; line-height:1.35; border-left:6px solid var(--red); padding:6px 14px; background:#f7f7f7; }
.dp-cap > div { display:none; } .dp-cap > div.on { display:block; }

/* ---------- Hub hero ---------- */
.hub-hero { display:grid; grid-template-columns:1fr 230px; gap:30px; align-items:center; margin-top:0.1em; }
.hub-what { font-size:0.8em; line-height:1.3; font-weight:bold; color:var(--ink); }
.reveal a.hub-url { display:inline-block; margin:16px 0 10px 0; font-size:0.95em; font-weight:bold; color:#fff !important; background:var(--red); padding:8px 20px; border-radius:12px; text-decoration:none; font-family:'Inconsolata', monospace; letter-spacing:.5px; }
.hub-sign { font-size:0.56em; line-height:1.4; color:#333; }
.hub-qr { text-align:center; }
.hub-qr img { width:210px; height:210px; margin:0 !important; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.18); }
.hub-qr span { display:block; font-size:0.46em; color:var(--gray); margin-top:6px; }
.hub-nums { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:22px; }
.hub-nums div { border-top:5px solid var(--navy); padding-top:8px; }
.hub-nums b { display:block; font-size:1.5em; line-height:1; color:var(--navy); }
.hub-nums span { font-size:0.54em; line-height:1.3; display:block; margin-top:4px; }
.roles { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px; }
.role { border-radius:12px; padding:10px 14px; font-size:0.54em; line-height:1.35; }
.role b { display:block; font-size:1.15em; margin-bottom:3px; }
.role.ra { background:#eef1f4; border-left:6px solid var(--navy); }
.role.ad { background:var(--wash); border-left:6px solid var(--red); }

/* ---------- Safeguards ---------- */
.safe { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:0.2em; }
.sg { border-radius:12px; background:#f6f7f8; padding:14px 16px; min-height:190px; box-sizing:border-box; }
.sg .ic { font-size:1.15em; line-height:1; }
.sg b { display:block; font-size:0.68em; margin:8px 0 4px 0; line-height:1.2; color:var(--ink); }
.sg span { display:block; font-size:0.56em; line-height:1.32; color:#333; }

/* ---------- Dry run ---------- */
.traps { width:100%; border-collapse:collapse; font-size:0.6em; }
.traps th { text-align:left; color:#fff; background:var(--navy); padding:6px 10px; }
.traps th:last-child { background:var(--green); }
.traps td { padding:8px 10px; border-bottom:1px solid #e6e6e6; vertical-align:top; line-height:1.28; }
.traps td:first-child { font-weight:bold; }

/* ---------- Flip cards ---------- */
.flip-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:0.15em; }
.flip { perspective:1200px; height:200px; cursor:pointer; }
.flip-in { position:relative; width:100%; height:100%; transition: transform .65s; transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.flip-f, .flip-b { position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden; border-radius:14px; padding:14px 18px; display:flex; flex-direction:column; justify-content:center; box-sizing:border-box; }
.flip-f { background:var(--navy); color:#fff; font-size:0.74em; font-weight:bold; line-height:1.25; }
.flip-f span { display:block; font-size:0.72em; font-weight:normal; opacity:.75; margin-top:8px; }
.flip-b { background:#fff; border:4px solid var(--green); transform: rotateY(180deg); font-size:0.68em; line-height:1.32; color:var(--ink); }
.flip-b b { color:var(--green); }

/* ---------- People ---------- */
.trio { display:grid; grid-template-columns:1.1fr 80px 1fr 1fr; gap:16px; align-items:center; margin-top:0.2em; }
.person { text-align:center; }
.person img, .person .avatar { width:150px; height:150px; border-radius:50%; object-fit:cover; margin:0 auto 8px auto !important; display:block; border:5px solid var(--red); box-sizing:border-box; }
.person .avatar { border-color:var(--navy); color:var(--navy); font-size:1.05em; display:flex; align-items:center; justify-content:center; }
.person b { display:block; font-size:0.7em; }
.person span { display:block; font-size:0.5em; color:var(--gray); line-height:1.3; }
.trio .link { text-align:center; font-size:1.6em; color:var(--red); }
.path5 { display:flex; gap:3px; margin-top:40px; }
.path5 .chev { display:flex; flex-direction:column; justify-content:center; font-size:0.6em; padding:14px 8px 14px 22px; min-height:84px; background:var(--navy); }
.path5 .chev b { display:block; font-size:1.05em; }
.path5 .chev span { font-size:0.85em; font-weight:normal; opacity:.9; }
.path5 .chev.hot { background:var(--red); }

/* ---------- Trainings checklist ---------- */
.tr-grid { width:100%; border-collapse:collapse; font-size:0.56em; margin-top:16px; }
.tr-grid th { color:#fff; background:var(--red); padding:6px 10px; text-align:center; }
.tr-grid th:first-child { text-align:left; }
.tr-grid td { padding:5px 10px; border-bottom:1px solid #eee; text-align:center; }
.tr-grid td:first-child { text-align:left; font-weight:bold; }
.tr-grid input[type=checkbox] { transform:scale(1.5); }

/* Hub stage: tighter picks so five fit */
.hubstage { grid-template-columns:1.85fr 1fr !important; }
.hubstage .pick { font-size:0.48em !important; padding:5px 0 5px 12px !important; margin-bottom:6px !important; line-height:1.25 !important; }


/* ---------- Day cards (road to the pre-pilot) ---------- */
.days { position:relative; display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-top:0.5em; }
.days:before { content:""; position:absolute; left:6%; right:6%; top:52px; border-top:4px solid #d8d8d8; z-index:0; }
.day { position:relative; z-index:1; text-align:center; border-radius:14px; padding:0 8px 12px 8px; background:#fff; border:2px solid #e3e3e3; }
.day .dd { width:96px; height:104px; margin:0 auto 8px auto; border-radius:12px; background:var(--navy); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; transform:translateY(-2px); }
.day .dd span { font-size:0.44em; text-transform:uppercase; letter-spacing:1.5px; font-weight:bold; }
.day .dd b { font-size:1.45em; line-height:1; }
.day .dt { font-size:0.54em; line-height:1.3; min-height:4.2em; margin-bottom:6px; }
.day.done .dd { background:var(--green); }
.day.today { border:3px dashed var(--red); }
.day.today .dd { background:#fff; color:var(--red); border:3px solid var(--red); box-sizing:border-box; }
.day.goal { background:var(--red); border-color:var(--red); color:#fff; }
.day.goal .dd { background:#fff; color:var(--red); }
.day.goal .dt { font-weight:bold; font-size:0.62em; }
.day .pill { font-size:0.46em; padding:3px 12px; }


/* ---------- AR decision ---------- */
.decided { background:var(--green); color:#fff; border-radius:10px; padding:10px 18px; font-weight:bold; margin-bottom:16px; box-shadow:0 2px 8px rgba(46,125,50,.3); }
.decided u { text-decoration-thickness:2px; }

/* Training-video stage */
.trainstage { grid-template-columns:1.9fr 1fr !important; }
.trainstage .pick { font-size:0.52em !important; padding:7px 0 7px 12px !important; margin-bottom:9px !important; line-height:1.28 !important; }
.trainstage .pick b { font-size:1.06em; }


/* ---------- Experiment walkthrough (xp): participant left, research assistant right ---------- */
.xp .vs-track { margin-top:38px; height:42px; }
.xp .vs-ticks { height:18px; }
.xp-body { position:relative; height:444px; margin-top:2px; }
.xp-step { position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .35s; }
.xp-step.on { opacity:1; pointer-events:auto; }
.xp-head { display:flex; align-items:center; gap:12px; height:34px; }
.xp-title { font-size:0.7em; font-weight:bold; color:var(--ink); }
.xp-title .mchip { font-size:0.9em; }
.xp-ovtag { display:none; margin-left:auto; font-size:0.44em; font-weight:bold; color:#1f2326; background:var(--corn); border-radius:8px; padding:4px 10px; }

/* ---------- Trainings slide: use the full height ---------- */

/* ---------- Team assignment: two point people, two new RAs ---------- */

.person .avatar.ura { border-color:var(--tanD); color:var(--tanD); }

/* ---------- Six orders: taller rows ---------- */
.reveal table.orders { font-size:0.74em; border-spacing:0 11px; margin-top:6px; }

/* ---------- VR walkthrough: label just above the footer ---------- */
.sim-note { position:absolute; left:0; right:0; top:652px; text-align:center; font-size:0.4em; color:var(--tanD); }
.sim-note b { display:inline-block; background:var(--corn); color:#3b3100; border-radius:10px; padding:1px 10px; margin-right:8px; letter-spacing:.05em; text-transform:uppercase; font-size:0.92em; }

.arm { background:#fff; border:1px solid #e3e0d5; border-top:6px solid var(--tanM); border-radius:10px; padding:12px 14px 14px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.arm:nth-child(1) { border-top-color:var(--red); } .arm:nth-child(2) { border-top-color:var(--navy); } .arm:nth-child(3) { border-top-color:#d8bd35; }

/* ---------- Hub in five steps: what it is, and how to get in, around the clips ---------- */

.hub-strip { display:grid; grid-template-columns:70px 1.2fr 1fr 1fr; gap:14px; align-items:center; margin-top:10px; padding:8px 12px; background:var(--tanL); border-radius:10px; font-size:0.42em; line-height:1.35; }

/* ---------- Interview transcription: the two consent paths ---------- */

/* ---------- What was said vs what the app wrote (word-level check, plays with the recording) ---------- */
.dfx-stats { display:grid; grid-template-columns:1.15fr 1fr 1fr 1fr 1fr 1.55fr; gap:10px; margin-top:2px; }
.dfx-stats > div { background:#fff; border:1px solid #e1ded3; border-radius:10px; padding:6px 12px; }
.dfx-stats b { display:block; font-size:0.9em; line-height:1.15; color:var(--ink); }

.dfx-stats .big b, .dfx-stats .big span { color:#fff; }
.dfx-stats .nmt { background:#fff8d6; border-color:#efd76a; }
.dfx-stats .nmt b { font-size:0.62em; padding-top:5px; }
.dfx-bar { display:flex; align-items:center; gap:12px; margin:8px 0 6px; font-size:0.4em; }
.dfx-play { font:inherit; font-size:1.15em; font-weight:bold; background:var(--red); color:#fff; border:none; border-radius:16px; padding:5px 14px; cursor:pointer; flex:none; }

.dfx-turn { display:grid; grid-template-columns:36px 96px 1fr; gap:8px; align-items:baseline; padding:5px 0; border-bottom:1px solid #f0eee7; font-size:0.42em; line-height:1.45; text-align:left; }
.dfx-tm { font-family:Consolas, "Courier New", monospace; color:var(--gray); }
.dfx-who { font-size:0.78em; font-weight:bold; text-transform:uppercase; letter-spacing:.04em; color:#fff; border-radius:10px; padding:1px 8px; text-align:center; }
.dfx-who.iv { background:var(--navy); }
.dfx-who.pt { background:var(--tanD); }
.dfx-mk { display:flex; justify-content:space-between; gap:10px; background:var(--navy); color:#fff; border-radius:6px; padding:3px 10px; margin:5px 0; font-family:Consolas, "Courier New", monospace; font-size:0.38em; font-weight:bold; }
.dfx-mk em { font-family:inherit; font-weight:normal; font-style:normal; opacity:.85; }
.dfx .w.fmt { text-decoration:underline dotted #9a9488; text-underline-offset:3px; }
.dfx .w.nm { background:var(--corn); border-radius:4px; padding:0 4px; }
.dfx .w.bad s { color:var(--red); }

.dfx.playing .dfx-body .w { color:#b7b2a6; transition:color .15s; }

/* ---------- Transcriber demo: the saved transcript writes itself in step with the video ---------- */
.tdemo { display:grid; grid-template-columns:0.8fr 1.2fr; gap:18px; align-items:start; margin-top:2px; }
.tdoc { height:548px; display:flex; flex-direction:column; border:1px solid #d9d6cb; border-radius:10px; background:#fff; box-shadow:0 3px 12px rgba(0,0,0,.12); overflow:hidden; }
.tdoc-bar { display:flex; align-items:center; gap:8px; background:var(--navy); color:#fff; padding:6px 12px; font-size:0.4em; font-family:Consolas, "Courier New", monospace; }
.tdoc-file { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tdoc-tag { background:var(--corn); color:#3b3100; font-weight:bold; padding:1px 8px; border-radius:10px; font-size:0.9em; }
.tdoc-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:var(--tanD); }
.tdoc-wave { display:flex; gap:6px; align-items:center; height:64px; }
.tdoc-wave i { display:block; width:9px; height:14px; border-radius:5px; background:var(--tanM); }
.tdemo[data-phase="run"] .tdoc-wave i { background:var(--red); animation:tdw .9s ease-in-out infinite; }
.tdoc-wave i:nth-child(2) { animation-delay:.1s } .tdoc-wave i:nth-child(3) { animation-delay:.2s } .tdoc-wave i:nth-child(4) { animation-delay:.3s }
.tdoc-wave i:nth-child(5) { animation-delay:.4s } .tdoc-wave i:nth-child(6) { animation-delay:.3s } .tdoc-wave i:nth-child(7) { animation-delay:.2s }
.tdoc-wave i:nth-child(8) { animation-delay:.1s }
@keyframes tdw { 0%,100% { height:14px } 50% { height:60px } }
.tdoc-msg { font-size:0.5em; font-weight:bold; }
.tdemo[data-phase="run"] .tdoc-msg { color:var(--red); }
.tdoc-bar2 { width:62%; height:8px; border-radius:4px; background:#f3d6db; overflow:hidden; visibility:hidden; }
.tdemo[data-phase="run"] .tdoc-bar2 { visibility:visible; }
.tdoc-bar2 > div { height:100%; width:34%; background:var(--red); border-radius:4px; animation:tdbar 1.3s ease-in-out infinite; }
@keyframes tdbar { from { transform:translateX(-100%) } to { transform:translateX(300%) } }
.tdoc-scroll { display:none; position:relative; flex:1; overflow-y:auto; padding:10px 14px 16px; scrollbar-width:thin; }
.tdemo[data-phase="out"] .tdoc-state { display:none; }
.tdemo[data-phase="out"] .tdoc-scroll { display:block; }
.tdoc-head { font-size:0.34em; line-height:1.5; color:#444; background:var(--tanL); border-radius:6px; padding:6px 10px; margin-bottom:9px; animation:twin .5s ease-out; }
.tdoc-head b { color:var(--navy); }
.tdoc-body { font-size:0.42em; line-height:1.5; color:var(--ink); }
.tdoc-body p, .tdoc-head, .tdoc-done { text-align:left !important; hyphens:none; }
.tdoc-body p { display:none; margin:0 0 0.55em 0; }
.tdoc-body p.on { display:block; }
.tdoc-body .tw { display:none; }
.tdoc-body .tw.on { display:inline; animation:twin .3s ease-out; }
@keyframes twin { from { opacity:0 } to { opacity:1 } }
.tdoc-body .tstamp { color:var(--navy); font-family:Consolas, "Courier New", monospace; font-size:0.9em; font-weight:bold; }
.tdoc-body mark { background:var(--corn); color:inherit; padding:0 3px; border-radius:3px; }
.tdoc-body .tq { display:none; margin:0.75em 0 0.45em; color:var(--red); font-weight:bold; border-top:2px solid #f3c9d0; padding-top:5px; }
.tdoc-body .tq.on { display:block; animation:twin .4s ease-out; }
.tdoc-body .tq span { display:inline-block; background:var(--red); color:#fff; border-radius:4px; padding:0 6px; margin-right:7px; font-size:0.9em; }
.tcaret { display:inline-block; width:2px; height:1em; background:var(--red); vertical-align:-0.15em; animation:tcb 1s steps(1) infinite; }

.tdemo.done .tcaret { display:none; }

<script>
(function () {
  // ---- Steppers: a slide's [data-stepper] blocks get data-step = number of visible .fragment.stepper in the slide.
  function stepCount(slide) { return slide ? slide.querySelectorAll('.fragment.visible.stepper, .fragment.visible[data-stepper-frag]').length : 0; }
  function pad(m) { var h = Math.floor(m / 60), mm = m % 60; return h + ':' + (mm < 10 ? '0' : '') + mm; }

  function updateVS(el, n) {
    var cards = el.querySelectorAll('.vs-card'); if (!cards.length) return;
    n = Math.min(n, cards.length - 1);
    cards.forEach(function (c, i) { c.classList.toggle('on', i === n); });
    var c = cards[n], a = +c.dataset.a, b = +c.dataset.b;
    var mk = el.querySelector('.vs-marker');
    if (mk) mk.style.left = (n === 0 ? 0 : a / 120 * 100) + '%';
    el.querySelectorAll('.vs-seg').forEach(function (s) {
      var sa = +s.dataset.a, sb = +s.dataset.b;
      s.classList.toggle('on', n > 0 && sa >= a && sb <= b && b > a);
      s.classList.toggle('done', n > 0 && sb <= a);
    });
  }

  // ---- Experiment walkthrough: steps, pen marks, camera, videos
  var XP = { token: 0 };
  function xpReset(st) {
    st.querySelectorAll('video').forEach(function (v) { try { v.pause(); v.currentTime = 0; } catch (e) {} });
    st.querySelectorAll('.xp-page').forEach(function (svg) {
      svg.classList.add('instant');
      svg.querySelectorAll('.ink.new').forEach(function (i) {
        i.classList.remove('done');
        var cl = i.querySelector('.cl'); if (cl) cl.style.width = '0px';
      });
    });
    st.querySelectorAll('.xp-notes .ink.new').forEach(function (i) { i.classList.remove('done'); });
    st.querySelectorAll('.xp-seq').forEach(function (sq) {
      sq.querySelectorAll(':scope > .xp-pg').forEach(function (p, i) { p.classList.toggle('on', i === 0); });
    });
    st.querySelectorAll('.xp-clock').forEach(function (c) { c.textContent = '00:00'; });
  }
  function animVB(svg, to, ms) {
    cancelAnimationFrame(svg._raf);
    var b = svg.viewBox.baseVal, from = [b.x, b.y, b.width, b.height];
    if (!ms) { svg.setAttribute('viewBox', to.join(' ')); return; }
    var t0 = performance.now();
    (function step(now) {
      var k = Math.min(1, (now - t0) / ms); k = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      svg.setAttribute('viewBox', from.map(function (a, i) { return a + (to[i] - a) * k; }).join(' '));
      if (k < 1) svg._raf = requestAnimationFrame(step);
    })(t0);
  }
  function cam(svg, ink, instant) {
    if (!svg || !ink) return;
    var r = svg.getBoundingClientRect(); var asp = (r.height && r.width) ? r.height / r.width : 0.78;
    var w = +svg.dataset.zoom || 292, h = w * asp;
    var cx = +ink.dataset.cx, cy = +ink.dataset.cy;
    var b = svg.viewBox.baseVal;
    if (!instant && b.width === w && cx > b.x + 0.12 * w && cx < b.x + 0.88 * w && cy > b.y + 0.15 * h && cy < b.y + 0.85 * h) return;
    var x = Math.max(0, Math.min(612 - w, cx - w * 0.6)), y = Math.max(0, Math.min(792 - h, cy - h * 0.42));
    animVB(svg, [x, y, w, h], instant ? 0 : 650);
  }
  function draw(it) {
    var ink = it.ink;
    if (ink.dataset.kind === 'text') {
      var tx = ink.querySelector('text'), cl = ink.querySelector('.cl');
      cam(ink.ownerSVGElement, ink, false);
      cl.style.transitionDuration = it.d + 's';
      cl.style.width = (tx.getComputedTextLength() + 8) + 'px';
    } else if (ink.dataset.kind === 'path') {
      cam(ink.ownerSVGElement, ink, false);
      ink.style.transitionDuration = it.d + 's';
    }
    ink.classList.add('done');
  }
  function runSeq(sq, tok, fromOv) {
    var pgs = Array.prototype.slice.call(sq.querySelectorAll(':scope > .xp-pg'));
    var span = +sq.dataset.span || 0, items = [];
    pgs.forEach(function (pg, pi) {
      pg.querySelectorAll('.ink.new').forEach(function (ink) {
        var d = ink.dataset.kind === 'text' ? Math.min(2.0, Math.max(0.35, (+ink.dataset.n || 4) * 0.05)) : (ink.dataset.kind === 'note' ? 0.45 : 0.35);
        items.push({ pg: pi, ink: ink, d: d });
      });
      var svg = pg.querySelector('svg.xp-page');
      if (svg) cam(svg, pg.querySelector('.ink.new') || pg.querySelector('.ink'), !(fromOv && pi === 0));
    });
    var base = items.reduce(function (s, it) { return s + it.d; }, 0) + (pgs.length - 1) * 0.9 + 1;
    var gap = span ? Math.max(0.15, Math.min(4, (span - base) / Math.max(1, items.length))) : 0.55;
    var t = 0.7, cur = 0;
    function at(sec, fn) { setTimeout(function () { if (XP.token === tok) fn(); }, sec * 1000); }
    items.forEach(function (it) {
      if (it.pg !== cur) { var p = it.pg; t += 0.4; at(t, function () { pgs.forEach(function (x, i) { x.classList.toggle('on', i === p); }); }); t += 0.5; cur = p; }
      at(t, function () { draw(it); }); t += it.d + gap;
    });
  }
  function xpRun(st, tok, fromOv) {
    st.querySelectorAll('.xp-page').forEach(function (svg) { void svg.getBoundingClientRect(); svg.classList.remove('instant'); });
    st.querySelectorAll('video.xp-vid').forEach(function (v) { try { v.currentTime = 0; } catch (e) {} v.play().catch(function () {}); });
    st.querySelectorAll('.xp-seq').forEach(function (sq) { runSeq(sq, tok, fromOv); });
    st.querySelectorAll('.xp-clock').forEach(function (c) {
      var to = +c.dataset.to || 300, t0 = performance.now(), dur = 24000;
      (function tick() {
        if (XP.token !== tok) return;
        var s = Math.min(to, Math.round((performance.now() - t0) / dur * to));
        var mm = Math.floor(s / 60), ss = s % 60; c.textContent = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
        if (s < to) setTimeout(tick, 250);
      })();
    });
  }
  function overviewVB(st) {
    st.querySelectorAll('svg.xp-page').forEach(function (svg) {
      var r = svg.getBoundingClientRect(); var asp = (r.height && r.width) ? r.height / r.width : 0.75;
      animVB(svg, [0, 0, 612, 612 * asp], 0);
    });
  }
  function updateXP(el, n) {
    var steps = el.querySelectorAll('.xp-step'); if (!steps.length) return;
    var ov = el.dataset.overview === '1';
    var si = n, phase = 'run';
    if (ov && n > 0) { si = Math.ceil(n / 2); phase = (n % 2 === 1) ? 'ov' : 'run'; }
    si = Math.min(si, steps.length - 1);
    var total = +el.dataset.total || 120;
    var st = steps[si], a = +st.dataset.a, b = +st.dataset.b;
    var mk = el.querySelector('.vs-marker');
    if (mk) mk.style.left = (si === 0 ? 0 : a / total * 100) + '%';
    el.querySelectorAll('.vs-seg').forEach(function (s) {
      var sa = +s.dataset.a, sb = +s.dataset.b;
      s.classList.toggle('on', si > 0 && sa >= a && sb <= b && b > a);
      s.classList.toggle('done', si > 0 && sb <= a);
    });
    if (el._cur === n) return;
    var fromOv = (el._si === si && el._phase === 'ov' && phase === 'run');
    el._cur = n; el._si = si; el._phase = phase;
    XP.token++;
    var tok = XP.token;
    steps.forEach(function (s, i) { if (i !== si) { s.classList.remove('on', 'ov'); xpReset(s); } });
    if (!fromOv) xpReset(st);
    st.classList.add('on');
    st.classList.toggle('ov', ov && si > 0 && phase === 'ov');
    if (si === 0) return;
    if (phase === 'ov') { overviewVB(st); return; }
    setTimeout(function () { if (XP.token === tok) xpRun(st, tok, fromOv); }, fromOv ? 150 : 350);
  }
  function updateDP(el, n) {
    el.querySelectorAll('.st').forEach(function (s) { var k = +s.dataset.k; s.classList.toggle('on', n > 0 && k === n); });
    el.querySelectorAll('.dp-cap > div').forEach(function (d, i) { d.classList.toggle('on', i === n); });
  }
  function apply() {
    if (!window.Reveal) return;
    var slide = Reveal.getCurrentSlide(); if (!slide) return;
    var n = stepCount(slide);
    document.querySelectorAll('.xp').forEach(function (x) { if (!slide.contains(x)) { if (x._cur !== undefined) XP.token++; x._cur = undefined; } });
    slide.querySelectorAll('[data-stepper]').forEach(function (el) {
      el.setAttribute('data-step', n);
      if (el.classList.contains('xp')) updateXP(el, n);
      else if (el.classList.contains('vs')) updateVS(el, n);
      if (el.classList.contains('dp')) updateDP(el, n);
    });
  }
  var started = false;
  function init() {
    if (started) return; started = true;
    ['fragmentshown', 'fragmenthidden', 'slidechanged'].forEach(function (e) { Reveal.on(e, apply); });
    apply();
  }
  function whenReveal() {
    if (!window.Reveal || !Reveal.on) { setTimeout(whenReveal, 60); return; }
    if (Reveal.isReady && Reveal.isReady()) init(); else Reveal.on('ready', init);
  }

  document.addEventListener('DOMContentLoaded', function () {
    // Cohort: 40 people, the last four marked as expected drop-outs.
    document.querySelectorAll('.cohort').forEach(function (c) {
      var n = +(c.dataset.n || 40), drop = +(c.dataset.drop || 4), html = '';
      var dropAt = [7, 18, 26, 35];
      for (var i = 0; i < n; i++) {
        html += '<svg viewBox="0 0 24 30" style="--i:' + i + '" class="' + (dropAt.indexOf(i) > -1 ? 'drop' : '') + '"><circle cx="12" cy="7" r="6" fill="currentColor"/><path d="M1 30v-7a11 9 0 0 1 22 0v7z" fill="currentColor"/></svg>';
      }
      c.innerHTML = html;
    });
    // Flip cards.
    document.querySelectorAll('.flip').forEach(function (f) { f.addEventListener('click', function () { f.classList.toggle('on'); }); });
    // Chapter buttons seek their video.
    document.querySelectorAll('.vr-stage').forEach(function (st) {
      var v = st.querySelector('video');
      st.querySelectorAll('.chap').forEach(function (b) {
        b.addEventListener('click', function () {
          st.querySelectorAll('.chap').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on'); v.currentTime = +b.dataset.t; v.play().catch(function () {});
        });
      });
      v.addEventListener('timeupdate', function () {
        var t = v.currentTime, best = null;
        st.querySelectorAll('.chap').forEach(function (b) { if (+b.dataset.t <= t + 0.2) best = b; });
        st.querySelectorAll('.chap').forEach(function (x) { x.classList.toggle('on', x === best); });
      });
    });
    whenReveal();
  });
})();
</script>
<script>
// Transcriber demo: everything on the left is a function of the video's currentTime, so pausing,
// looping, or jumping with the step buttons keeps the transcript and the video in step.
(function () {
  function build(el) {
    var body = el.querySelector('.tdoc-body'), units = [];
    var src = el.querySelector('.tdemo-src').textContent.trim();
    src.split(/\n\s*\n/).forEach(function (para) {
      para = para.trim(); if (!para) return;
      var m = para.match(/^=== Question (\d+): (.+?) ===$/);
      if (m) {
        var q = document.createElement('div');
        q.className = 'tq';
        q.innerHTML = '<span>Question ' + m[1] + '</span>';
        q.appendChild(document.createTextNode(m[2]));
        q._first = units.length;
        body.appendChild(q);
        units.push({ el: q, blk: q });
        return;
      }
      var p = document.createElement('p');
      p._first = units.length;
      body.appendChild(p);
      para.split(/\s+/).forEach(function (w) {
        var s = document.createElement('span');
        if (/^\[\d\d:\d\d\]$/.test(w)) { s.className = 'tw tstamp'; s.textContent = w + ' '; }
        else if (w.indexOf('[name]') === 0) {
          s.className = 'tw';
          var mk = document.createElement('mark'); mk.textContent = '[name]';
          s.appendChild(mk); s.appendChild(document.createTextNode(w.slice(6) + ' '));
        } else { s.className = 'tw'; s.textContent = w + ' '; }
        p.appendChild(s);
        units.push({ el: s, blk: p });
      });
    });
    var c = document.createElement('span'); c.className = 'tcaret';
    el._caret = c; el._units = units; el._n = 0;
    el.querySelectorAll('.tchips button').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = el.querySelector('video');
        try { v.currentTime = +b.dataset.t; } catch (e) {}
        v.play().catch(function () {});
      });
    });
  }
  function update(el) {
    var v = el.querySelector('video'); if (!v) return;
    var t = v.currentTime || 0, go = +el.dataset.go, ready = +el.dataset.ready, fin = +el.dataset.finish;
    var phase = t < go ? 'wait' : (t < ready ? 'run' : 'out');
    if (el.getAttribute('data-phase') !== phase) el.setAttribute('data-phase', phase);
    var msg = el.querySelector('.tdoc-msg');
    if (phase === 'wait') msg.textContent = 'Waiting for the RA to click Transcribe';
    if (phase === 'run') msg.textContent = 'Transcribing on this computer\u2026';
    var U = el._units, N = U.length;
    var n = phase === 'out' ? Math.max(0, Math.min(N, Math.ceil((t - ready) / (fin - ready) * N))) : 0;
    var i;
    if (n > el._n) {
      for (i = el._n; i < n; i++) { U[i].el.classList.add('on'); U[i].blk.classList.add('on'); }
    } else if (n < el._n) {
      for (i = n; i < el._n; i++) {
        U[i].el.classList.remove('on');
        if (U[i].blk._first >= n) U[i].blk.classList.remove('on');
      }
    }
    if (n !== el._n) {
      el._n = n;
      if (n > 0) U[n - 1].el.insertAdjacentElement('afterend', el._caret);
      el.classList.toggle('done', n >= N);
    }
    var best = null;
    el.querySelectorAll('.tchips button').forEach(function (b) { if (+b.dataset.t <= t + 0.05) best = b; });
    el.querySelectorAll('.tchips button').forEach(function (b) { b.classList.toggle('on', b === best); });
    var sc = el.querySelector('.tdoc-scroll');
    if (n === 0) { sc.scrollTop = 0; return; }
    var last = el.classList.contains('done') ? el.querySelector('.tdoc-done') : U[n - 1].el;
    var target = Math.max(0, last.offsetTop + last.offsetHeight - sc.clientHeight + 26);
    sc.scrollTop += (target - sc.scrollTop) * 0.2;
  }
  var raf = 0;
  function loop() {
    raf = 0;
    var slide = window.Reveal && Reveal.getCurrentSlide && Reveal.getCurrentSlide(), any = false;
    document.querySelectorAll('.tdemo').forEach(function (el) {
      if (slide && slide.contains(el)) { any = true; update(el); }
    });
    if (any) raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.tdemo').forEach(build);
    (function wait() {
      if (!window.Reveal || !Reveal.on) { setTimeout(wait, 80); return; }
      Reveal.on('slidechanged', kick);
      Reveal.on('ready', kick);
      kick();
    })();
  });
})();
</script>
<script>
// "What was said vs what the app wrote": play the mock interview and light up each word as it is spoken.
// Every word carries data-t, the time it starts in the recording, so the page simply follows the audio clock.
(function () {
  function fmt(t) { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2); }
  function setup(el) {
    var a = el.querySelector('audio'), btn = el.querySelector('.dfx-play'), tm = el.querySelector('.dfx-time');
    var body = el.querySelector('.dfx-body');
    var words = Array.prototype.slice.call(el.querySelectorAll('.dfx-body .w'));
    var ts = words.map(function (w) { return +w.dataset.t; });
    var dur = +el.dataset.dur || 116, last = -1, raf = 0;
    function paint() {
      var t = a.currentTime || 0, n = 0;
      while (n < ts.length && ts[n] <= t) n++;
      if (n !== last) {
        last = n;
        words.forEach(function (w, i) { w.classList.toggle('said', i < n - 1); w.classList.toggle('now', i === n - 1); });
        var cur = words[Math.max(0, n - 1)];
        if (cur && el.classList.contains('playing')) {
          body.scrollTo({ top: Math.max(0, cur.offsetTop - body.clientHeight * 0.4), behavior: 'smooth' });
        }
      }
      tm.textContent = fmt(t) + ' / ' + fmt(dur);
      if (!a.paused) raf = requestAnimationFrame(paint);
    }
    btn.addEventListener('click', function () {
      if (a.paused) { if (a.ended) a.currentTime = 0; a.play().catch(function () {}); } else { a.pause(); }
    });
    a.addEventListener('play', function () {
      el.classList.add('playing'); btn.innerHTML = '&#10074;&#10074; Pause'; last = -1;
      cancelAnimationFrame(raf); raf = requestAnimationFrame(paint);
    });
    a.addEventListener('pause', function () { btn.innerHTML = '&#9654; Play the recording'; paint(); });
    a.addEventListener('ended', function () { el.classList.remove('playing'); btn.innerHTML = '&#9654; Play again'; });
    el._stop = function () { if (!a.paused) a.pause(); };
  }
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.dfx').forEach(setup);
    (function wait() {
      if (!window.Reveal || !Reveal.on) { setTimeout(wait, 80); return; }
      Reveal.on('slidechanged', function (ev) {
        document.querySelectorAll('.dfx').forEach(function (el) {
          if (!(ev.currentSlide && ev.currentSlide.contains(el)) && el._stop) el._stop();
        });
      });
    })();
  });
})();
</script>
