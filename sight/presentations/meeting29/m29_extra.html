<script>
document.addEventListener("DOMContentLoaded", function () {
  // Clip stage: one large captioned video, chosen from the list beside it.
  document.querySelectorAll(".stage").forEach(function (st) {
    var v = st.querySelector("video");
    st.querySelectorAll(".pick").forEach(function (b) {
      b.addEventListener("click", function () {
        st.querySelectorAll(".pick").forEach(function (x) { x.classList.remove("on"); });
        b.classList.add("on");
        v.src = b.dataset.src;
        v.play().catch(function () {});
      });
    });
  });
  // Assessment tabs.
  document.querySelectorAll(".a-t").forEach(function (t) {
    t.addEventListener("click", function () {
      document.querySelectorAll(".a-t").forEach(function (x) { x.classList.remove("on"); });
      document.querySelectorAll(".a-p").forEach(function (x) { x.classList.remove("on"); });
      t.classList.add("on");
      document.getElementById(t.dataset.p).classList.add("on");
    });
  });
});
</script>
